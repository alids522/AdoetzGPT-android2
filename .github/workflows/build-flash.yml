name: Build AdoetzGPT Flash APK

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ──────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Set up JDK 17 ──────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 4. Cache Gradle ────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── 5. Install frontend dependencies ───────
      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      # ── 6. Build frontend (SvelteKit static) ───
      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          NODE_ENV: production

      # ── 7. Copy frontend build to Android assets ─
      - name: Copy frontend to Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r frontend/build/. android/app/src/main/assets/public/
          echo "Frontend files copied:"
          ls -la android/app/src/main/assets/public/ | head -20

      # ── 8. Make gradlew executable ─────────────
      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: android

      # ── 9. Build Debug APK ─────────────────────
      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: android

      # ── 10. Build Release APK ──────────────────
      - name: Set up Release Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keystore.jks
            cat > android/keystore.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          fi

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        working-directory: android

      # ── 11. Get APK info ───────────────────────
      - name: Get APK info (Debug)
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "✅ Debug APK: $APK_NAME ($APK_SIZE)"

      - name: Get APK info (Release)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          APK_NAME=$(basename "$APK_PATH")
          APK_SIZE=$(du -sh "$APK_PATH" | cut -f1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "✅ Release APK: $APK_NAME ($APK_SIZE)"

      # ── 12. Upload APK ────────────────────────
      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: AdoetzGPT-Flash-debug-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 30

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: AdoetzGPT-Flash-release-${{ github.run_number }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      # ── 13. Build Summary ──────────────────────
      - name: Build Summary
        if: always()
        run: |
          echo "## 📱 AdoetzGPT Flash Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK Name | ${APK_NAME:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${APK_SIZE:-N/A} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download from **Artifacts** section." >> $GITHUB_STEP_SUMMARY
